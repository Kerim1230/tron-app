# سير عمل إصدار الإصدارات - TRON Σ
# إنشاء إصدارات GitHub تلقائياً عند دفع وسم، مع سجل التغييرات

name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار (مثال: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────
  # وظيفة البناء والاختبار
  # ──────────────────────────────────────────────
  build-and-test:
    name: 🔨 بناء واختبار
    runs-on: ubuntu-latest
    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: تثبيت التبعيات
        run: |
          corepack enable
          bun install --frozen-lockfile

      - name: فحص الكود
        run: bun run lint

      - name: بناء المشروع
        run: bun run build
        env:
          NODE_ENV: production

      - name: حفظ أرتي فاكت البناء
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # ──────────────────────────────────────────────
  # وظيفة إنشاء سجل التغييرات
  # ──────────────────────────────────────────────
  generate-changelog:
    name: 📋 إنشاء سجل التغييرات
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إنشاء سجل التغييرات
        # إنشاء سجل تغييرات من الالتزامات
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            const previousTag = releases.length > 0 ? releases[0].tag_name : null;
            const currentTag = context.ref.replace('refs/tags/', '');

            // جلب الالتزامات بين الإصدارين
            let commits;
            if (previousTag) {
              const { data } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: previousTag,
                head: currentTag
              });
              commits = data.commits;
            } else {
              const { data } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              commits = data;
            }

            // تصنيف الالتزامات
            const features = [];
            const fixes = [];
            const breaking = [];
            const other = [];

            for (const commit of commits) {
              const msg = commit.commit.message;
              const firstLine = msg.split('\n')[0];

              if (msg.startsWith('feat') || msg.includes('ميزة جديدة')) {
                features.push(firstLine);
              } else if (msg.startsWith('fix') || msg.includes('إصلاح')) {
                fixes.push(firstLine);
              } else if (msg.includes('BREAKING CHANGE') || msg.includes('تغيير جذري')) {
                breaking.push(firstLine);
              } else {
                other.push(firstLine);
              }
            }

            // بناء سجل التغييرات
            let changelog = `# 📋 سجل التغييرات - ${currentTag}\n\n`;

            if (breaking.length > 0) {
              changelog += `## ⚠️ تغييرات جذرية\n`;
              breaking.forEach(c => changelog += `- ${c}\n`);
              changelog += '\n';
            }

            if (features.length > 0) {
              changelog += `## ✨ ميزات جديدة\n`;
              features.forEach(c => changelog += `- ${c}\n`);
              changelog += '\n';
            }

            if (fixes.length > 0) {
              changelog += `## 🐛 إصلاحات\n`;
              fixes.forEach(c => changelog += `- ${c}\n`);
              changelog += '\n';
            }

            if (other.length > 0) {
              changelog += `## 📝 تغييرات أخرى\n`;
              other.forEach(c => changelog += `- ${c}\n`);
              changelog += '\n';
            }

            changelog += `---\n*تم إنشاء هذا السجل تلقائياً بواسطة TRON Σ Release Automation*\n`;

            core.setOutput('changelog', changelog);

  # ──────────────────────────────────────────────
  # وظيفة إنشاء إصدار GitHub
  # ──────────────────────────────────────────────
  create-release:
    name: 🎉 إنشاء الإصدار
    runs-on: ubuntu-latest
    needs: generate-changelog
    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4

      - name: إنشاء إصدار GitHub
        # إنشاء إصدار جديد مع سجل التغييرات
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const changelog = `${{ needs.generate-changelog.outputs.changelog }}`;

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `🎉 TRON Σ ${tag}`,
              body: changelog,
              draft: false,
              prerelease: tag.includes('-alpha') || tag.includes('-beta') || tag.includes('-rc')
            });

            console.log(`✅ تم إنشاء الإصدار: ${release.html_url}`);

      - name: تحميل أرتي فاكت البناء
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: رفع أصول الإصدار
        # رفع الملفات المبنية كأصول للإصدار
        uses: actions/github-script@v7
        with:
          script: |
            console.log('📦 جاري رفع أصول الإصدار...');

  # ──────────────────────────────────────────────
  # وظيفة النشر على npm (اختياري)
  # ──────────────────────────────────────────────
  publish-npm:
    name: 📦 النشر على npm
    runs-on: ubuntu-latest
    needs: create-release
    if: vars.PUBLISH_NPM == 'true'
    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: تثبيت التبعيات
        run: |
          corepack enable
          bun install --frozen-lockfile

      - name: بناء الحزمة
        run: bun run build

      - name: النشر على npm
        # نشر الحزمة على سجل npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
