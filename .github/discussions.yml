# تكوين فئات المناقشات - TRON Σ
# تعريف فئات المناقشات المتاحة في المستودع

categories:
  # ──────────────────────────────────────────────
  # فئة الإعلانات
  # ──────────────────────────────────────────────
  - name: Announcements
    slug: announcements
    description: |
      إعلانات رسمية عن TRON Σ. الإصدارات الجديدة، التحديثات المهمة،
      والتغييرات الجذرية. فقط المشرفون يمكنهم إنشاء مناقشات هنا.
    emoji: "📢"
    is_answerable: false
    # فقط المشرفون يمكنهم النشر
    default_order: newest

  # ──────────────────────────────────────────────
  # فئة الأفكار
  # ──────────────────────────────────────────────
  - name: Ideas
    slug: ideas
    description: |
      شارك أفكارك لميزات جديدة في TRON Σ. اقترح تحسينات،
      ميزات مطلوبة، أو حلول إبداعية للمشاكل الحالية.
      صوّت للأفكار التي تؤيدها! 🌟
    emoji: "💡"
    is_answerable: true
    default_order: most_votes

  # ──────────────────────────────────────────────
  # فئة الأسئلة والأجوبة
  # ──────────────────────────────────────────────
  - name: Q&A
    slug: q-a
    description: |
      اسأل أي سؤال عن TRON Σ. كيف تستخدم ميزة معينة؟
      كيف تحل مشكلة واجهتها؟ المجتمع هنا للمساعدة! 🤝
    emoji: "❓"
    is_answerable: true
    default_order: newest

  # ──────────────────────────────────────────────
  # فئة العرض والمشاركة
  # ──────────────────────────────────────────────
  - name: Show and Tell
    slug: show-and-tell
    description: |
      أرنا ما بنيت باستخدام TRON Σ! شارك مشاريعك،
      التخصيصات، الإضافات، والتجارب الملهمة. 🎨
    emoji: "🎪"
    is_answerable: true
    default_order: newest

