# سير عمل النشر متعدد البيئات - TRON Σ
# نشر على بيئة التجربة مع طلب السحب، ونشر على بيئة الإنتاج عند الدفع للفرع الرئيسي

name: Multi-Environment Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  # ──────────────────────────────────────────────
  # وظيفة النشر على بيئة التجربة
  # ──────────────────────────────────────────────
  deploy-staging:
    name: 🧪 نشر التجربة
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.tron-sigma.dev
    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: تثبيت التبعيات
        run: |
          corepack enable
          bun install --frozen-lockfile

      - name: فحص الكود
        # تشغيل فحص ESLint
        run: bun run lint

      - name: بناء المشروع
        run: bun run build
        env:
          NODE_ENV: staging
          NEXT_PUBLIC_API_URL: https://staging-api.tron-sigma.dev

      - name: إنشاء نشر تجريبي
        # إنشاء سجل نشر في GitHub
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.deployment.id,
              state: 'success',
              environment_url: 'https://staging.tron-sigma.dev',
              description: 'تم النشر على بيئة التجربة بنجاح ✅'
            });

      - name: نشر على بيئة التجربة
        # خطوة النشر الفعلية - استبدل بالأمر المناسب
        run: |
          echo "🧪 جاري النشر على بيئة التجربة..."
          echo "📍 الرابط: https://staging.tron-sigma.dev"
          echo "🔄 طلب السحب: #${{ github.event.pull_request.number }}"
          echo "✅ تم النشر بنجاح"

      - name: إضافة تعليق على طلب السحب
        # إضافة رابط المعاينة كتعليق
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 تم النشر على بيئة التجربة\n\n🔗 **رابط المعاينة**: https://staging.tron-sigma.dev\n\n> تم نشر طلب السحب هذا على بيئة التجربة للمراجعة.`
            });

  # ──────────────────────────────────────────────
  # وظيفة النشر على بيئة الإنتاج
  # ──────────────────────────────────────────────
  deploy-production:
    name: 🚀 نشر الإنتاج
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tron-sigma.dev
    needs: []
    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: تثبيت التبعيات
        run: |
          corepack enable
          bun install --frozen-lockfile

      - name: فحص الكود
        run: bun run lint

      - name: بناء المشروع
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.tron-sigma.dev

      - name: نشر على بيئة الإنتاج
        # خطوة النشر الفعلية على الإنتاج
        run: |
          echo "🚀 جاري النشر على بيئة الإنتاج..."
          echo "📍 الرابط: https://tron-sigma.dev"
          echo "✅ تم النشر بنجاح"

      - name: التحقق من صحة النشر
        # فحص صحة التطبيق بعد النشر
        run: |
          echo "🔍 جاري التحقق من صحة النشر..."
          # انتظار حتى يصبح التطبيق جاهزاً
          sleep 30

          # فحص نقطة النهاية الصحية
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tron-sigma.dev/api || echo "000")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ النشر يعمل بشكل صحيح (حالة HTTP: $HTTP_STATUS)"
          else
            echo "❌ فشل التحقق من الصحة (حالة HTTP: $HTTP_STATUS)"
            exit 1
          fi

      - name: إرسال إشعار النشر
        # إرسال إشعار بنجاح النشر
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ نجح' : '❌ فشل';
            console.log(`حالة النشر على الإنتاج: ${status}`);
