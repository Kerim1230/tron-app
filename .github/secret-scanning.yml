# تكوين فحص الأسرار - TRON Σ
# أنماط مخصصة لكشف المفاتيح والأسرار المسربة

name: TRON Σ Secret Scanning

# ──────────────────────────────────────────────
# تفعيل فحص الأسرار
# ──────────────────────────────────────────────
enable:
  - secret_scanning
  - push_protection

# ──────────────────────────────────────────────
# الأنماط المخصصة لكشف الأسرار
# ──────────────────────────────────────────────
custom_patterns:
  # نمط مفاتيح OpenRouter API
  # تنسيق: sk-or-v1- متبوع بأحرف أبجدية رقمية
  - name: "OpenRouter API Key"
    pattern: 'sk-or-v1-[a-zA-Z0-9]{48}'
    description: |
      مفتاح واجهة برمجة تطبيقات OpenRouter.
      يُستخدم للوصول إلى نماذج الذكاء الاصطناعي.
    secret_type: "openrouter_api_key"

  # نمط رموز الوصول الشخصي لـ GitHub
  # تنسيق: ghp_ متبوع بأحرف أبجدية رقمية
  - name: "GitHub Personal Access Token"
    pattern: 'ghp_[a-zA-Z0-9]{36}'
    description: |
      رمز وصول شخصي لـ GitHub.
      يمنح صلاحيات وصول للمستودعات.
    secret_type: "github_personal_access_token"

  # نمط مفاتيح Vercel
  # تنسيق: vcp_ متبوع بأحرف أبجدية رقمية
  - name: "Vercel API Key"
    pattern: 'vcp_[a-zA-Z0-9]{32,}'
    description: |
      مفتاح واجهة برمجة تطبيقات Vercel.
      يُستخدم للنشر وإدارة المشاريع.
    secret_type: "vercel_api_key"

  # نمط مفاتيح OpenAI API
  # تنسيق: sk- متبوع بأحرف أبجدية رقمية
  - name: "OpenAI API Key"
    pattern: 'sk-[a-zA-Z0-9]{48}'
    description: |
      مفتاح واجهة برمجة تطبيقات OpenAI.
      يُستخدم للوصول إلى نماذج GPT.
    secret_type: "openai_api_key"

  # نمط مفاتيح Anthropic API
  # تنسيق: sk-ant- متبوع بأحرف أبجدية رقمية
  - name: "Anthropic API Key"
    pattern: 'sk-ant-[a-zA-Z0-9\-]{80,}'
    description: |
      مفتاح واجهة برمجة تطبيقات Anthropic.
      يُستخدم للوصول إلى نموذج Claude.
    secret_type: "anthropic_api_key"

  # نمط سلاسل اتصال قاعدة البيانات
  # تنسيق: سلسلة اتصال تحتوي على كلمة مرور
  - name: "Database Connection String"
    pattern: '(?:mongodb|postgres|mysql|redis)://[^\s:]+:[^\s@]+@[^\s]+'
    description: |
      سلسلة اتصال قاعدة بيانات تحتوي على بيانات اعتماد.
      قد تحتوي على اسم مستخدم وكلمة مرور.
    secret_type: "database_connection_string"

  # نمط مفاتيح JWT
  # تنسيق: سلسلة طويلة تبدأ بـ jwt_secret أو مشابه
  - name: "JWT Secret"
    pattern: '(?:JWT_SECRET|jwt_secret|NEXTAUTH_SECRET)\s*[:=]\s*["\x27]?[a-zA-Z0-9\-._~+/]+=*["\x27]?'
    description: |
      مفتاح سري لرموز JWT.
      يُستخدم لتوقيع والتحقق من رموز المصادقة.
    secret_type: "jwt_secret"

  # نمط متغيرات البيئة الحساسة
  # تنسيق: مفتاح بيئة يحتوي على secret أو key أو token
  - name: "Sensitive Environment Variable"
    pattern: '(?:SECRET|PRIVATE_KEY|ACCESS_TOKEN|AUTH_TOKEN)\s*[:=]\s*["\x27]?[a-zA-Z0-9\-._~+/]{20,}["\x27]?'
    description: |
      متغير بيئة يحتوي على قيمة حساسة.
      قد يكون مفتاح API أو رمز مصادقة.
    secret_type: "sensitive_env_var"

# ──────────────────────────────────────────────
# قائمة المسارات المستثناة من الفحص
# ──────────────────────────────────────────────
ignore_paths:
  - "node_modules/**"
  - ".next/**"
  - "dist/**"
  - "build/**"
  - "**/*.lock"
  - "**/*.min.js"
  - "**/*.min.css"
  - "docs/**"
  - ".github/workflows/**"

# ──────────────────────────────────────────────
# إعدادات إضافية
# ──────────────────────────────────────────────
# إرسال تنبيهات عند اكتشاف أسرار
alert_on_discovery: true
# حظر الدفع الذي يحتوي على أسرار
block_push_with_secrets: true
