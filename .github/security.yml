# سياسة الأمان - TRON Σ
# إرشادات الإبلاغ عن الثغرات الأمنية وسياسة الأمان

name: TRON Σ Security Policy

# ──────────────────────────────────────────────
# الإبلاغ عن ثغرة أمنية
# ──────────────────────────────────────────────
reporting:
  # طريقة الإبلاغ المفضلة
  preferred_method: "security_advisory"
  # رابط الإبلاغ
  url: "https://github.com/Kerim1230/tron-sigma/security/advisories/new"
  # بديل: البريد الإلكتروني
  email: "security@tron-sigma.dev"
  # وقت الاستجابة المتوقع
  response_time: "48 ساعة"
  # لغة التواصل
  languages:
    - "العربية"
    - "English"

# ──────────────────────────────────────────────
# الإصدارات المدعومة
# ──────────────────────────────────────────────
supported_versions:
  - version: "1.x"
    supported: true
    security_fixes: true
  - version: "0.x"
    supported: false
    security_fixes: false
    note: "الإصدارات التجريبية - لا تتلقى تحديثات أمنية"

# ──────────────────────────────────────────────
# نطاق سياسة الأمان
# ──────────────────────────────────────────────
scope:
  # ما نقبله كثغرة أمنية
  in_scope:
    - "ثغرات XSS (البرمجة عبر المواقع)"
    - "حقن SQL أو NoSQL"
    - "ثغرات CSRF (تزوير الطلبات عبر المواقع)"
    - "تسريب بيانات المستخدمين"
    - "تنفيذ كود عن بُعد"
    - "تجاوز الصلاحيات"
    - "ثغرات في مكتبات الطرف الثالث"
    - "تسريب المفاتيح والأسرار"

  # ما لا نقبله كثغرة أمنية
  out_of_scope:
    - "هجمات حجب الخدمة (DoS)"
    - "هجمات القوة الغاشمة"
    - "مشاكل الأداء بدون تأثير أمني"
    - "ثغرات في إصدارات المكتبات القديمة بدون إثبات قابلية الاستغلال"
    - "مشاكل تتطلب وصولاً مادياً للجهاز"

# ──────────────────────────────────────────────
# إرشادات الإبلاغ
# ──────────────────────────────────────────────
guidelines:
  title: "إرشادات الإبلاغ عن الثغرات الأمنية"
  steps:
    - step: 1
      title: "لا تنشر الثغرة علنياً"
      description: |
        يُرجى عدم نشر تفاصيل الثغرة في المشاكل العامة أو المناقشات
        أو أي قناة عامة. استخدم قناة الإبلاغ السري.

    - step: 2
      title: "اجمع المعلومات"
      description: |
        يُرجى تضمين المعلومات التالية في تقريرك:
        - وصف الثغرة ونوعها
        - خطوات إعادة الإنتاج
        - الإصدار المتأثر
        - نظام التشغيل والمتصفح
        - أي إثبات مفاهيمي (PoC)

    - step: 3
      title: "انتظر الاستجابة"
      description: |
        سنتواصل معك خلال 48 ساعة لتأكيد استلام التقرير.
        سنقدم تحديثاً كل 7 أيام حتى يتم الحل.

    - step: 4
      title: "التنسيق للإفصاح"
      description: |
        ننسق مع الباحثين لتحديد تاريخ الإفصاح المناسب.
        عادةً بعد 90 يوماً من الإبلاغ أو بعد إصدار الإصلاح.

# ──────────────────────────────────────────────
# مكافآت الأمان
# ──────────────────────────────────────────────
bounty:
  enabled: false
  note: |
    حالياً لا نقدم مكافآت مالية للثغرات الأمنية، لكننا نقدر
    مساهماتك ونذكر الباحثين في نصائح الأمان الخاصة بنا.

# ──────────────────────────────────────────────
# ممارسات الأمان في التطوير
# ──────────────────────────────────────────────
development_practices:
  - "فحص أمني تلقائي مع CodeQL"
  - "فحص الأسرار المسربة قبل الدفع"
  - "تحديثات أمنية تلقائية مع Dependabot"
  - "مراجعة كود إلزامية لطلبات السحب"
  - "اختبار اختراق دوري"
  - "تشفير البيانات الحساسة في الراحة والنقل"
  - "استخدام HTTPS فقط في الإنتاج"
  - "التحقق من المدخلات من جانب الخادم"

# ──────────────────────────────────────────────
# جهات اتصال الأمان
# ──────────────────────────────────────────────
contacts:
  security_lead: "@Kerim1230"
  team: "@Kerim1230/tron-security"
