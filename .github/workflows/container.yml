# سير عمل بناء ونشر الحاوية - TRON Σ
# بناء صورة Docker ونشرها إلى GitHub Container Registry

name: Container Build & Push

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'وسم الحاوية (اختياري)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # وظيفة البناء والنشر
  # ──────────────────────────────────────────────
  build-and-push:
    name: 🐳 بناء ونشر الحاوية
    runs-on: ubuntu-latest

    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v4

      - name: إعداد Docker Buildx
        # إعداد بناء Docker متعدد المنصات
        uses: docker/setup-buildx-action@v3

      - name: تسجيل الدخول إلى GitHub Container Registry
        # المصادقة مع سجل حاويات GitHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: استخراج البيانات الوصفية
        # استخراج الوسوم والتسميات للصورة
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: بناء ونشر صورة الحاوية
        # بناء الصورة مع التخزين المؤقت للطبقات
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # التخزين المؤقت للطبقات لتسريع البناء
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # بناء متعدد المنصات
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1

      - name: التحقق من الصورة
        # التحقق من أن الصورة تعمل بشكل صحيح
        run: |
          echo "✅ تم بناء ونشر الصورة بنجاح"
          echo "📦 الوسوم: ${{ steps.meta.outputs.tags }}"
          echo "🏷️ التسميات: ${{ steps.meta.outputs.labels }}"
